[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  # zisi 不做激进打包，将 node_modules 原样带入函数包：
  # @libsql/client 依赖平台原生模块（@libsql/linux-x64-gnu），esbuild 打包会漏掉导致 502
  node_bundler = "zisi"
  included_files = ["views/**/*"]

[dev]
  command = "npm run dev"
  targetPort = 3000

# 所有未命中静态文件的路径交给 Express 函数处理；
# publish 目录里存在的文件仍由 CDN 直出（默认 force=false 行为）
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
